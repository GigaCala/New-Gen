{% extends "base.html" %}

{% block title %}Member Login | New Gen{% endblock %}

{% block content %}

<style>
.login-page {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
}

.login-card {
    width: 100%;
    max-width: 480px;
    padding: 45px;
    border-radius: 24px;
    background: rgba(20,20,24,.94);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 25px 70px rgba(0,0,0,.4);
}

.login-header {
    text-align: center;
    margin-bottom: 35px;
}

.login-header h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.login-header p {
    opacity: .7;
}

.login-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.login-form label {
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
}

.login-form input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05);
    color: inherit;
}

.login-btn {
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#d6b25e,#f0d78c);
    color: #111;
    font-weight: 700;
    cursor: pointer;
}

.login-links {
    text-align: center;
    margin-top: 25px;
    line-height: 2;
}

.login-links a {
    color: #d6b25e;
}
</style>

<section class="login-page">

    <div class="login-card">

        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Enter the New Gen.</p>
        </div>

        <form method="POST" class="login-form">

            <div>
                <label>Username or Email</label>
                <input
                    type="text"
                    name="login"
                    placeholder="Username or email"
                    required
                >
            </div>

            <div>
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Your password"
                    required
                >
            </div>

            <button class="login-btn" type="submit">
                Log In
            </button>

        </form>

        <div class="login-links">
            <div>
                Don't have an account?
                <a href="{{ url_for('signup') }}">Join New Gen</a>
            </div>

            <div>
                <a href="{{ url_for('executive_apply') }}">
                    Executive applications
                </a>
            </div>
        </div>

    </div>

</section>

{% endblock %}
