{% extends "base.html" %}

{% block title %}Member Login | New Gen{% endblock %}

{% block content %}

<main class="login-page">

    <section class="login-panel">

        <div class="login-panel-inner">

            <!-- BRAND -->

            <div class="login-brand">

                <div class="login-mark">
                    NG
                </div>

                <div>
                    <span>NEW GEN</span>
                    <small>MEMBER ACCESS</small>
                </div>

            </div>


            <!-- HEADING -->

            <div class="login-heading">

                <span class="login-label">
                    MEMBER LOGIN
                </span>

                <h1>
                    Welcome<br>
                    <em>back.</em>
                </h1>

                <p>
                    Sign in to your New Gen account.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="login-form"
            >

                <!-- USERNAME / EMAIL -->

                <div class="login-field">

                    <label for="login">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Username or email"
                        autocomplete="username"
                        value="{{ request.form.get('login', '') }}"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="login-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="login-button"
                >
                    <span>LOG IN</span>
                    <strong>→</strong>
                </button>

            </form>


            <!-- REGISTER -->

            <div class="login-register">

                <p>
                    Don't have an account?
                </p>

                <a href="{{ url_for('signup') }}">
                    Create an account
                    <span>→</span>
                </a>

            </div>


            <!-- ADMIN -->

            <div class="login-admin">

                <a href="{{ url_for('admin_login') }}">
                    Administrator login →
                </a>

            </div>

        </div>

    </section>

</main>

{% endblock %}
